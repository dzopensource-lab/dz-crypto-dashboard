<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DZ Crypto Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <span class="logo-icon">₿</span>
        <div>
          <h1>DZ Crypto Dashboard</h1>
          <p>Suivi des marchés en temps réel</p>
        </div>
      </div>
      <div id="clock" class="clock">--:--</div>
    </header>

    <main>
      <div id="loading" class="loading">Chargement des données...</div>
      <div id="error" class="error hidden"></div>
      
      <div id="dashboard" class="hidden">
        <div id="cards" class="cards"></div>
        <div class="chart-container">
          <canvas id="marketChart"></canvas>
        </div>
      </div>
    </main>

    <footer>
      <p>© 2026 <a href="mailto:lionweb01@gmail.com">Oussama Boudinar</a> · Données : CoinGecko API</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
